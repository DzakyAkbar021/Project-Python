{% extends "base.html" %}
{% block title %}Login Admin{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5 col-xl-4">
      <div class="card card-adu">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="ikon-bulat mb-3 mx-auto"><i class="bi bi-person-lock"></i></div>
            <h1 class="h4 fw-bold mb-1">Login Admin</h1>
            <p class="text-muted small mb-0">Khusus pengelola AduSekolah.</p>
          </div>

          <form method="post" action="{{ url_for('admin.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ tujuan }}">

            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input type="text" class="form-control" id="username" name="username"
                     autocomplete="username" autofocus required>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control" id="password" name="password"
                     autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-box-arrow-in-right me-1"></i>Masuk
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
